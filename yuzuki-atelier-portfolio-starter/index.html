<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ゆずきの自己紹介ページ</title>
  <meta name="description" content="1ページだけのシンプルな自己紹介サイトです。" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="card">
      <h1>ゆずきの自己紹介</h1>

      <p class="intro">
        はじめまして、ゆずきです。Webデザインの勉強をしています。
        やさしく見やすいサイト作りが好きで、毎日少しずつ練習中です。
      </p>

      <section class="block" aria-labelledby="favorite-title">
        <h2 id="favorite-title">好きなもの3つ</h2>
        <ul>
          <li>カフェめぐり</li>
          <li>イラストを描くこと</li>
          <li>やさしい色の雑貨</li>
        </ul>
      </section>

      <section class="block" aria-labelledby="image-title">
        <h2 id="image-title">画像スペース</h2>
        <div class="image-placeholder" role="img" aria-label="ここにプロフィール画像を置けます">
          ここに画像を入れられます
        </div>
      </section>

      <section class="block" aria-labelledby="sns-title">
        <h2 id="sns-title">SNSリンク</h2>
        <nav class="sns-links" aria-label="SNSリンク一覧">
          <a href="#" target="_blank" rel="noopener noreferrer">X（旧Twitter）</a>
          <a href="#" target="_blank" rel="noopener noreferrer">Instagram</a>
          <a href="#" target="_blank" rel="noopener noreferrer">YouTube</a>
        </nav>
      </section>
    </section>
  </main>
</body>
</html>
